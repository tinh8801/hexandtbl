name: Windows build

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout source
        uses: actions/checkout@v5

      - name: Install Qt
        uses: jurplel/install-qt-action@v4
        with:
          version: '6.8.3'
          host: 'windows'
          target: 'desktop'
          arch: 'win64_msvc2022_64'
          archives: 'qtbase'
          cache: true

      - name: Configure CMake
        run: cmake -S . -B build -A x64

      - name: Compile
        run: cmake --build build --config Release --parallel

      - name: Package Qt runtime
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force package
          Copy-Item build/Release/hexandtabler.exe package/
          windeployqt --release package/hexandtabler.exe

      - name: Upload package
        uses: actions/upload-artifact@v6
        with:
          name: hexandtabler-windows
          path: package/